<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rắn Săn Mồi Mini 🐍</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 12px 40px;
  }
  h1 { font-size: 1.8rem; margin: 10px 0 4px; }
  p.sub { opacity: .75; margin-bottom: 14px; font-size: .95rem; }
  .wrap {
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 16px;
    padding: 16px;
    backdrop-filter: blur(8px);
    box-shadow: 0 10px 40px rgba(0,0,0,.4);
    width: 100%;
    max-width: 440px;
  }
  .hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    font-weight: 600;
  }
  .hud .badge {
    background: rgba(0,0,0,.35);
    padding: 6px 14px;
    border-radius: 999px;
    font-size: .95rem;
  }
  #game {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #0b1e24;
    border-radius: 12px;
    display: block;
    border: 2px solid rgba(255,255,255,.12);
    touch-action: none;
  }
  .controls { display: flex; gap: 8px; margin-top: 12px; }
  button {
    flex: 1;
    border: none;
    border-radius: 10px;
    padding: 12px 8px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform .05s, filter .15s;
  }
  button:active { transform: scale(.97); }
  #btnStart { background: #22c55e; color: #06270f; }
  #btnPause { background: #facc15; color: #422006; }
  #btnReset { background: #ef4444; color: #fff; }
  button:hover { filter: brightness(1.1); }
  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 60px);
    grid-template-rows: repeat(3, 60px);
    gap: 6px;
    justify-content: center;
    margin-top: 14px;
  }
  .dpad button {
    background: rgba(255,255,255,.15);
    color: #fff;
    font-size: 1.4rem;
    border: 1px solid rgba(255,255,255,.2);
  }
  .hint { margin-top: 12px; font-size: .85rem; opacity: .7; text-align: center; line-height: 1.5; }
  #overlay {
    text-align: center;
    margin-top: 10px;
    min-height: 24px;
    font-weight: 700;
    color: #facc15;
  }
  footer { margin-top: 16px; opacity: .5; font-size: .8rem; }
</style>
</head>
<body>
  <h1>🐍 Rắn Săn Mồi</h1>
  <p class="sub">Game mini tĩnh — deploy hosting free là chạy</p>

  <div class="wrap">
    <div class="hud">
      <div class="badge">Điểm: <span id="score">0</span></div>
      <div class="badge">🏆 Kỷ lục: <span id="best">0</span></div>
    </div>
    <canvas id="game" width="400" height="400"></canvas>
    <div id="overlay">Nhấn Bắt đầu để chơi</div>
    <div class="controls">
      <button id="btnStart">▶ Bắt đầu</button>
      <button id="btnPause">⏸ Tạm dừng</button>
      <button id="btnReset">↺ Chơi lại</button>
    </div>
    <div class="dpad">
      <span></span><button data-dir="up">⬆</button><span></span>
      <button data-dir="left">⬅</button><button data-dir="down">⬇</button><button data-dir="right">➡</button>
    </div>
    <div class="hint">⌨️ Dùng phím mũi tên / WASD • 📱 Vuốt trên màn hình hoặc bấm nút điều hướng</div>
  </div>
  <footer>Botkeep Static Web • HTML + CSS + JS thuần • Không cần server</footer>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const overlay = document.getElementById('overlay');

const GRID = 20;
const CELL = canvas.width / GRID;

let snake, dir, nextDir, food, score, best = +(localStorage.getItem('snake_best') || 0);
let loop = null, speed = 140, running = false, paused = false;

bestEl.textContent = best;

function reset() {
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = {x:1,y:0}; nextDir = {x:1,y:0};
  score = 0; speed = 140; paused = false;
  scoreEl.textContent = '0';
  placeFood();
  draw();
}

function placeFood() {
  while (true) {
    food = { x: Math.floor(Math.random()*GRID), y: Math.floor(Math.random()*GRID) };
    if (!snake.some(s => s.x===food.x && s.y===food.y)) break;
  }
}

function draw() {
  ctx.fillStyle = '#0b1e24';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  // lưới mờ
  ctx.strokeStyle = 'rgba(255,255,255,.04)';
  for (let i=1;i<GRID;i++){
    ctx.beginPath(); ctx.moveTo(i*CELL,0); ctx.lineTo(i*CELL,canvas.height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,i*CELL); ctx.lineTo(canvas.width,i*CELL); ctx.stroke();
  }
  // mồi
  ctx.fillStyle = '#ef4444';
  ctx.beginPath();
  ctx.arc(food.x*CELL+CELL/2, food.y*CELL+CELL/2, CELL*0.38, 0, Math.PI*2);
  ctx.fill();
  // rắn
  snake.forEach((s,i)=>{
    ctx.fillStyle = i===0 ? '#22c55e' : '#16a34a';
    roundRect(s.x*CELL+1, s.y*CELL+1, CELL-2, CELL-2, 5);
    ctx.fill();
    if (i===0) { // mắt
      ctx.fillStyle = '#fff';
      ctx.fillRect(s.x*CELL+6, s.y*CELL+5, 4, 4);
      ctx.fillRect(s.x*CELL+12, s.y*CELL+5, 4, 4);
    }
  });
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(x,y,w,h,r) : ctx.rect(x,y,w,h);
}

function step() {
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  // đâm tường hoặc cắn thân
  if (head.x<0||head.y<0||head.x>=GRID||head.y>=GRID ||
      snake.some(s=>s.x===head.x&&s.y===head.y)) {
    return gameOver();
  }
  snake.unshift(head);
  if (head.x===food.x && head.y===food.y) {
    score += 10;
    scoreEl.textContent = score;
    if (score > best) { best = score; bestEl.textContent = best; localStorage.setItem('snake_best', best); }
    speed = Math.max(60, speed - 4); // càng ăn càng nhanh
    restartLoop();
    placeFood();
  } else {
    snake.pop();
  }
  draw();
}

function restartLoop(){
  clearInterval(loop);
  loop = setInterval(()=>{ if(!paused) step(); }, speed);
}

function start(){
  if (running && !paused) return;
  if (!running) reset();
  running = true; paused = false;
  overlay.textContent = 'Đang chơi... Ăn càng nhiều càng nhanh!';
  restartLoop();
}

function pause(){
  if (!running) return;
  paused = !paused;
  overlay.textContent = paused ? '⏸ Đang tạm dừng' : 'Đang chơi...';
}

function gameOver(){
  running = false;
  clearInterval(loop);
  overlay.textContent = `💀 Thua rồi! Được ${score} điểm. Bấm Chơi lại nhé!`;
}

function setDir(x,y){
  // chặn đảo chiều 180 độ
  if (dir.x===-x && dir.y===-y) return;
  nextDir = {x,y};
}

document.getElementById('btnStart').onclick = start;
document.getElementById('btnPause').onclick = pause;
document.getElementById('btnReset').onclick = ()=>{ running=false; clearInterval(loop); reset(); overlay.textContent='Nhấn Bắt đầu để chơi'; };

document.querySelectorAll('.dpad button').forEach(b=>{
  b.onclick = ()=>{
    const d = b.dataset.dir;
    if(d==='up') setDir(0,-1);
    if(d==='down') setDir(0,1);
    if(d==='left') setDir(-1,0);
    if(d==='right') setDir(1,0);
  };
});

window.addEventListener('keydown', e=>{
  const k = e.key.toLowerCase();
  if (['arrowup','w'].includes(k)) setDir(0,-1);
  else if (['arrowdown','s'].includes(k)) setDir(0,1);
  else if (['arrowleft','a'].includes(k)) setDir(-1,0);
  else if (['arrowright','d'].includes(k)) setDir(1,0);
  else if (k===' ') { e.preventDefault(); running ? pause() : start(); }
  else if (k==='enter') start();
});

// vuốt trên mobile
let tx=0, ty=0;
canvas.addEventListener('touchstart', e=>{ tx=e.touches[0].clientX; ty=e.touches[0].clientY; }, {passive:true});
canvas.addEventListener('touchmove', e=>{
  e.preventDefault();
  const dx=e.touches[0].clientX-tx, dy=e.touches[0].clientY-ty;
  if (Math.abs(dx)<20 && Math.abs(dy)<20) return;
  if (Math.abs(dx)>Math.abs(dy)) setDir(dx>0?1:-1, 0);
  else setDir(0, dy>0?1:-1);
  tx=e.touches[0].clientX; ty=e.touches[0].clientY;
}, {passive:false});

reset();
</script>
</body>
</html>
