
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test kết nối Python API</title>
</head>
<body>
  <h1>Kiểm tra kết nối Python</h1>

  <button id="testButton">Gọi Python API</button>
  <p id="status">Chưa kết nối</p>
  <ul id="results"></ul>

  <script>
    const API_URL = "https://ff4aer.bot-keep.xyz/";

    document.getElementById("testButton").addEventListener("click", async () => {
      const status = document.getElementById("status");
      const results = document.getElementById("results");

      status.textContent = "Đang gọi Python...";
      results.replaceChildren();

      try {
        const response = await fetch(`${API_URL}/api/test`);

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();

        status.textContent = data.message;

        data.images.forEach(image => {
          const item = document.createElement("li");
          item.textContent =
            `${image.name} — độ tương đồng: ${image.similarity}`;
          results.appendChild(item);
        });
      } catch (error) {
        status.textContent = `Lỗi kết nối: ${error.message}`;
      }
    });
  </script>
</body>
</html>
